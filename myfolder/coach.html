<!DOCTYPE html>
<html lang="en">
<head>
  <!-- =========================
       PAGE SETUP
  ========================== -->
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Outliers Training Club - Coach Dashboard</title>

  <!-- =========================
       FONT
  ========================== -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <!-- =========================
       SHARED CSS
  ========================== -->
  <link
    rel="stylesheet"
    href="/myfolder/CSS/base.css"
  >

  <!-- =========================
       TEMPORARY COACH CSS
       Move this to coach.css later
  ========================== -->
  <style>
    .coach-dashboard {
      width: min(900px, 92%);
      margin: 50px auto;
    }

    .coach-heading {
      margin-bottom: 30px;
      text-align: center;
    }

    .coach-heading h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 5vw, 3.5rem);
    }

    .coach-heading p {
      margin: 0;
      font-size: 1.05rem;
    }

    .client-card {
      padding: 25px;
    }

.client-card h2 {
  margin-top: 0;
  margin-bottom: 20px;
  text-align: center;
}

    .client-button-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .client-button {
      display: flex;
      align-items: center;
      justify-content: space-between;

      width: 100%;
      box-sizing: border-box;
      padding: 18px 20px;

      border: 2px solid #111111;
      border-radius: 0;

      background: #ffffff;
      color: #111111;

      font-family: "Atkinson Hyperlegible", sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      text-decoration: none;

      cursor: pointer;
      transition:
        transform 0.15s ease,
        background-color 0.15s ease;
    }

    .client-button:hover,
    .client-button:focus-visible {
      background: #ece9e6;
      transform: translateX(5px);
    }

    .client-button-arrow {
      font-size: 1.4rem;
    }

    @media (max-width: 600px) {
      .coach-dashboard {
        width: min(94%, 900px);
        margin-top: 30px;
      }

      .client-card {
        padding: 18px;
      }

      .client-button {
        padding: 16px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================

  ========================== -->
  <nav>

    </a>

      <a href="/myfolder/meal_planner.html">

      <a href="/myfolder/cart.html">

      <a href="/myfolder/coach.html">

    </div>

  <!-- =========================

    <!-- =========================

        <a

        <a

    </section>

        <!-- =========================

  <!-- =========================

  ========================== -->
  <footer>
    OUTLIERS TRAINING CLUB © 2026
  </footer>

  <!-- =========================
       TEMPORARY COACH JAVASCRIPT
       Move this to coach.js later
  ========================== -->
  <script>
    const hamburger =
      document.getElementById("hamburger");

    const mobileMenu =
      document.getElementById("mobile-menu");

    if (hamburger && mobileMenu) {
      hamburger.addEventListener(
        "click",
        () => {
          mobileMenu.style.display =
            mobileMenu.style.display === "flex"
              ? "none"
              : "flex";
        }
      );
    }

    const clientButtons =
      document.querySelectorAll(
        ".client-button"
      );

    clientButtons.forEach(button => {
      button.addEventListener(
        "click",
        () => {
          const clientName =
            button.dataset.clientName;

          console.log(
            `Opening dashboard for ${clientName}`
          );
        }
      );
    });
  </script>

</body>
</html>
