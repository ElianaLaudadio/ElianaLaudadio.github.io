<!DOCTYPE html>
<html lang="en">
<head>
  <!-- =========================
       PAGE SETUP
  ========================== -->
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Outliers Training Club - Coach Dashboard
  </title>

  <!-- =========================
       FONT
  ========================== -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <!-- =========================
       SHARED CSS
  ========================== -->
  <link
    rel="stylesheet"
    href="/myfolder/CSS/base.css"
  >

  <!-- =========================
       TEMPORARY COACH CSS
       Move this to coach.css later
  ========================== -->
  <style>
    .coach-dashboard {
      width: min(900px, 92%);
      margin: 50px auto;
    }

    .coach-heading {
      margin-bottom: 30px;
      text-align: center;
    }

    .coach-heading h1 {
      margin: 0 0 10px;
      font-size: clamp(
        2rem,
        5vw,
        3.5rem
      );
    }

    .client-card {
      padding: 25px;
      margin-bottom: 30px;
    }

    .client-card h2 {
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
    }

    .client-button-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .client-button {
      display: flex;
      align-items: center;
      justify-content: space-between;

      width: 100%;
      box-sizing: border-box;
      padding: 18px 20px;

      border: 2px solid #111111;
      border-radius: 0;

      background: #ffffff;
      color: #111111;

      font-family:
        "Atkinson Hyperlegible",
        sans-serif;

      font-size: 1.15rem;
      font-weight: 700;
      text-decoration: none;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        background-color 0.15s ease;
    }

    .client-button:hover,
    .client-button:focus-visible {
      background: #ece9e6;
      transform: translateX(5px);
    }

    .client-button-arrow {
      font-size: 1.4rem;
    }

    .coach-status-message {
      margin: 0;
      text-align: center;
    }

    .coach-error-message {
      margin: 0;
      text-align: center;
      font-weight: 700;
    }

    @media (max-width: 600px) {
      .coach-dashboard {
        width: min(94%, 900px);
        margin-top: 30px;
      }

      .client-card {
        padding: 18px;
      }

      .client-button {
        padding: 16px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       NAVIGATION
  ========================== -->
  <nav>
    <a href="/myfolder/template.html">Home</a>
    <a href="/myfolder/coach.html">Coach Dashboard</a>
    <a href="/myfolder/workouts.html">Workouts</a>
    <a href="/myfolder/meal_planner.html">Meal Planner</a>
    <a href="/myfolder/cart.html">Grocery List</a>

    <span id="hamburger">&#9776;</span>

    <div id="mobile-menu">
      <a href="/myfolder/template.html">Home</a>
      <a href="/myfolder/coach.html">Coach Dashboard</a>
      <a href="/myfolder/workouts.html">Workouts</a>
      <a href="/myfolder/meal_planner.html">Meal Planner</a>
      <a href="/myfolder/cart.html">Grocery List</a>
    </div>
  </nav>

  <!-- =========================
       COACH DASHBOARD
  ========================== -->
  <main class="coach-dashboard">

    <header class="coach-heading">
      <h1>Coach Dashboard</h1>
    </header>

    <!-- =========================
         CLIENT PROGRESS
    ========================== -->
    <section class="card client-card">
      <h2>Clients</h2>

      <div
        id="clientList"
        class="client-button-list"
      >
        <p class="coach-status-message">
          Loading clients...
        </p>
      </div>
    </section>

    <!-- =========================
         CLIENT PROGRAMMING
    ========================== -->
    <section class="card client-card">
      <h2>Programming</h2>

      <div
        id="programmingClientList"
        class="client-button-list"
      >
        <p class="coach-status-message">
          Loading clients...
        </p>
      </div>
    </section>

  </main>

  <!-- =========================
       FOOTER
  ========================== -->
  <footer>
    OUTLIERS TRAINING CLUB © 2026
  </footer>

  <!-- =========================
       SUPABASE + AUTH
  ========================== -->
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script
    src="/myfolder/js/auth.js?v=10"
  ></script>

  <!-- =========================
       TEMPORARY COACH JAVASCRIPT
       Move this to coach.js later
  ========================== -->
  <script>

    /* =========================
       MOBILE NAVIGATION
    ========================== */

    const hamburger =
      document.getElementById(
        "hamburger"
      );

    const mobileMenu =
      document.getElementById(
        "mobile-menu"
      );

    if (
      hamburger &&
      mobileMenu
    ) {
      hamburger.addEventListener(
        "click",
        () => {
          mobileMenu.style.display =
            mobileMenu.style.display ===
            "flex"
              ? "none"
              : "flex";
        }
      );
    }


    /* =========================
       PAGE ELEMENTS
    ========================== */

    const clientList =
      document.getElementById(
        "clientList"
      );

    const programmingClientList =
      document.getElementById(
        "programmingClientList"
      );


    /* =========================
       CREATE CLIENT BUTTON
    ========================== */

    function createClientButton(
      client,
      destination
    ) {

      const link =
        document.createElement(
          "a"
        );

      link.className =
        "client-button";


      link.href =
        `${destination}?client=${encodeURIComponent(
          client.id
        )}`;


      link.dataset.clientId =
        client.id;


      const clientName =
        client.display_name ||
        "Unnamed Client";


      link.innerHTML = `
        <span>
          ${clientName}
        </span>

        <span class="client-button-arrow">
          →
        </span>
      `;


      return link;

    }


    /* =========================
       RENDER CLIENT BUTTONS
    ========================== */

    function renderClientLists(
      clients
    ) {

      clientList.innerHTML =
        "";


      programmingClientList.innerHTML =
        "";


      if (!clients.length) {

        clientList.innerHTML = `
          <p class="coach-status-message">
            No clients are assigned yet.
          </p>
        `;


        programmingClientList.innerHTML = `
          <p class="coach-status-message">
            No clients are assigned yet.
          </p>
        `;


        return;

      }


      clients.forEach(
        client => {

          /* =========================
             PROGRESS BUTTON
          ========================== */

          const progressButton =
            createClientButton(
              client,
              "/myfolder/client_progress.html"
            );


          /* =========================
             PROGRAMMING BUTTON
          ========================== */

          const programmingButton =
            createClientButton(
              client,
              "/myfolder/client_program.html"
            );


          clientList.appendChild(
            progressButton
          );


          programmingClientList.appendChild(
            programmingButton
          );

        }
      );

    }


    /* =========================
       LOAD ASSIGNED CLIENTS
    ========================== */

    async function loadCoachClients(
      coachId
    ) {

      const {
        data,
        error
      } =
        await window.auth.supabase
          .from("profiles")
          .select(
            "id, display_name, role, coach_id"
          )
          .eq(
            "coach_id",
            coachId
          )
          .eq(
            "role",
            "client"
          )
          .order(
            "display_name",
            {
              ascending: true
            }
          );


      if (error) {
        throw error;
      }


      return data || [];

    }


    /* =========================
       LOAD COACH PROFILE
    ========================== */

    async function loadCoachProfile(
      userId
    ) {

      const {
        data,
        error
      } =
        await window.auth.supabase
          .from("profiles")
          .select(
            "id, display_name, role"
          )
          .eq(
            "id",
            userId
          )
          .single();


      if (error) {
        throw error;
      }


      return data;

    }


    /* =========================
       SHOW PAGE ERROR
    ========================== */

    function showCoachPageError(
      message
    ) {

      clientList.innerHTML = `
        <p class="coach-error-message">
          ${message}
        </p>
      `;


      programmingClientList.innerHTML = `
        <p class="coach-error-message">
          ${message}
        </p>
      `;

    }


    /* =========================
       INITIALIZE PAGE
    ========================== */

    async function initializeCoachPage() {

      try {

        const user =
          await window.auth.requireAuth();


        if (!user) {
          return;
        }


        const coachProfile =
          await loadCoachProfile(
            user.id
          );


        if (
          coachProfile.role !==
          "coach"
        ) {

          window.location.href =
            "/myfolder/template.html";


          return;

        }


        const clients =
          await loadCoachClients(
            user.id
          );


        renderClientLists(
          clients
        );


      } catch (error) {

        console.error(
          "Could not load coach dashboard:",
          error
        );


        showCoachPageError(
          "Clients could not be loaded."
        );

      }

    }


    initializeCoachPage();

  </script>

</body>
</html>
