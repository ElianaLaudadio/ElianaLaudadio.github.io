  <!-- =========================

    <a href="/myfolder/workouts.html">

    <!-- MOBILE HAMBURGER -->

    <span id="hamburger">

    <!-- MOBILE MENU -->

    <div id="mobile-menu">

  <!-- =========================

  <footer>

  </footer>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script
    src="/myfolder/js/auth.js?v=10"
  ></script>


  <script>

    /* =========================
       MOBILE NAVIGATION
    ========================== */

    const hamburger =
      document.getElementById(
        "hamburger"
      );

    const mobileMenu =
      document.getElementById(
        "mobile-menu"
      );


    if (hamburger && mobileMenu) {

      hamburger.addEventListener(
        "click",
        () => {

          mobileMenu.style.display =
            mobileMenu.style.display === "flex"
              ? "none"
              : "flex";

        }
      );

    }


    /* =========================
       REQUIRE LOGIN
    ========================== */

    async function initializePage() {

      try {

        const user =
          await window.auth.requireAuth();

        if (!user) {
          return;
        }


        /* =========================
           PROGRAM INITIALIZATION
        ========================== */

        // Program setup will go here.


      } catch (error) {

        console.error(
          "Could not initialize program page:",
          error
        );

      }

    }


    initializePage();

  </script>


</body>
