<!DOCTYPE html>
<html lang="en">

<head>

  <!-- =========================
       PAGE SETUP
  ========================== -->

  <meta charset="UTF-8" />

  <meta

    content="width=device-width, initial-scale=1.0"
  />

  <!-- =========================
       FONT

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap"
    rel="stylesheet"

  <!-- =========================
       CSS
  ========================== -->

    rel="stylesheet"
    href="/myfolder/CSS/base.css"

  <link
    rel="stylesheet"

  >

  <link
    rel="stylesheet"
    href="/myfolder/CSS/styles.css"
  >


  <!-- =========================
       PROGRAM PAGE CSS
  ========================== -->

  <style>

    /* =========================
       PAGE
    ========================== */

    .program-page {
      width: 90%;
      max-width: 900px;
      margin: 40px auto;
    }


    .program-header {
      text-align: center;
      margin-bottom: 35px;
    }


    .program-header h1 {
      margin-bottom: 8px;
    }


    /* =========================
       PROGRAM INFO
    ========================== */

    .program-info {
      background: var(--card, #ffffff);

      border: 3px solid var(--border, #111111);

      padding: 20px;

      margin-bottom: 28px;

      box-sizing: border-box;
    }


    .program-info h2 {
      margin-top: 0;
      margin-bottom: 8px;
    }


    .program-info p {
      margin-bottom: 0;
      white-space: pre-wrap;
    }


    /* =========================
       NO PROGRAM MESSAGE
    ========================== */

    .no-program-message {
      background: var(--card, #ffffff);

      border: 3px solid var(--border, #111111);

      padding: 24px;

      text-align: center;

      box-sizing: border-box;
    }


    /* =========================
       WORKOUT DAYS
    ========================== */

    .workout-day {
      background: var(--card, #ffffff);

      border: 3px solid var(--border, #111111);

      margin-bottom: 28px;

      box-sizing: border-box;
    }


    .workout-day-header {
      border-bottom: 3px solid var(--border, #111111);

      padding: 16px 20px;
    }


    .workout-day-header h2 {
      margin: 0;
    }


    .workout-day-header p {
      margin: 5px 0 0;
    }


    /* =========================
       EXERCISES
    ========================== */

    .exercise-list {
      padding: 20px;
    }


    .exercise {
      padding: 16px 0;
    }


    .exercise:first-child {
      padding-top: 0;
    }


    .exercise:last-child {
      padding-bottom: 0;
    }


    .exercise h3 {
      margin: 0 0 8px;
    }


    .exercise-prescription {
      font-weight: 700;

      margin-bottom: 6px;
    }


    .exercise-note {
      margin: 0;

      white-space: pre-wrap;
    }


    /* =========================
       WORKOUT ACTIONS
    ========================== */

    .workout-actions {
      border-top: 3px solid var(--border, #111111);

      padding: 16px 20px;

      display: flex;

      justify-content: center;
      align-items: center;
    }


    .quick-log-button {
      border: 3px solid var(--border, #111111);

      background: var(--fg, #111111);

      color: var(--card, #ffffff);

      padding: 10px 22px;

      font-family:
        "Atkinson Hyperlegible",
        sans-serif;

      font-weight: 700;

      font-size: 15px;

      cursor: pointer;

      box-shadow: 4px 4px 0 #777;
    }


    .quick-log-button:hover {
      transform: translate(2px, 2px);

      box-shadow: 2px 2px 0 #777;
    }


    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 600px) {

      .program-page {
        width: 92%;

        margin: 24px auto;
      }


      .program-info {
        padding: 16px;
      }


      .workout-day-header {
        padding: 14px 16px;
      }


      .exercise-list {
        padding: 16px;
      }


      .workout-actions {
        padding: 14px 16px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       NAVIGATION
  ========================== -->

  <nav id="mainNav">

    <a href="/myfolder/template.html">
      Home
    </a>

    <a href="/myfolder/workouts.html">
      Workouts
    </a>

    <a href="/myfolder/meal_planner.html">
      Meal Planner
    </a>

    <a href="/myfolder/cart.html">
      Grocery List
    </a>


    <span id="hamburger">
      &#9776;
    </span>


    <div id="mobile-menu">

      <a href="/myfolder/template.html">
        Home
      </a>

      <a href="/myfolder/workouts.html">
        Workouts
      </a>

      <a href="/myfolder/meal_planner.html">
        Meal Planner
      </a>

      <a href="/myfolder/cart.html">
        Grocery List
      </a>

    </div>

  </nav>


  <!-- =========================
       MAIN PAGE
  ========================== -->

  <main>

    <section class="program-page">


      <!-- =========================
           PAGE HEADER
      ========================== -->

      <div class="program-header">

        <h1 id="clientProgramHeading">
          My Program
        </h1>

      </div>


      <!-- =========================
           PROGRAM INFO
      ========================== -->

      <section
        class="program-info"
        id="programInfo"
      >

        <h2>
          Notes from your Coach
        </h2>

        <p id="coachNotesDisplay">
          Loading your program...
        </p>

      </section>


      <!-- =========================
           WORKOUT DAYS
      ========================== -->

      <div id="workoutDaysContainer"></div>


    </section>

  </main>


  <!-- =========================
       QUICK WORKOUT LOG PANEL
  ========================== -->

  <div
    class="log-panel"
    id="workoutLogPanel"
  >

    <h2>
      Log Workout
    </h2>


    <textarea
      id="workoutInput"
      placeholder="What workout did you do today? What did you try that was new?"
      rows="5"
    ></textarea>


    <button id="saveWorkoutBtn">
      Save Log
    </button>


    <button
      type="button"
      class="cancel-log-button"
      id="cancelWorkoutLogBtn"
    >
      Don't Log
    </button>

  </div>


  <!-- =========================
       FOOTER
  ========================== -->

  <footer>
    OUTLIERS TRAINING CLUB © 2026
  </footer>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <script
    src="/myfolder/js/auth.js?v=10"
  ></script>


  <script>

    /* =========================
       MOBILE NAVIGATION
    ========================== */

    const hamburger =
      document.getElementById(
        "hamburger"
      );


    const mobileMenu =
      document.getElementById(
        "mobile-menu"
      );


    if (
      hamburger &&
      mobileMenu
    ) {

      hamburger.addEventListener(
        "click",
        () => {

          mobileMenu.style.display =
            mobileMenu.style.display ===
            "flex"
              ? "none"
              : "flex";

        }
      );

    }


    /* =========================
       PAGE ELEMENTS
    ========================== */

    const workoutDaysContainer =
      document.getElementById(
        "workoutDaysContainer"
      );


    const coachNotesDisplay =
      document.getElementById(
        "coachNotesDisplay"
      );


    const workoutLogPanel =
      document.getElementById(
        "workoutLogPanel"
      );


    const workoutInput =
      document.getElementById(
        "workoutInput"
      );


    const saveWorkoutBtn =
      document.getElementById(
        "saveWorkoutBtn"
      );


    const cancelWorkoutLogBtn =
      document.getElementById(
        "cancelWorkoutLogBtn"
      );


    let activeQuickLogButton =
      null;


    /* =========================
       ESCAPE HTML
    ========================== */

    function escapeHtml(
      value
    ) {

      return String(
        value ?? ""
      )
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );

    }


    /* =========================
       LOAD CLIENT NAME
    ========================== */

    async function loadClientName(
      userId
    ) {

      const {
        data,
        error
      } =
        await window.auth.supabase
          .from("profiles")
          .select(
            "display_name"
          )
          .eq(
            "id",
            userId
          )
          .single();


      if (error) {
        throw error;
      }


      const displayName =
        data?.display_name ||
        "My";


      const heading =
        document.getElementById(
          "clientProgramHeading"
        );


      if (!heading) {
        return;
      }


      if (
        displayName === "My"
      ) {

        heading.textContent =
          "My Program";


        return;

      }


      heading.textContent =
        `${displayName}'s Program`;

    }


    /* =========================
       RENDER CLIENT PROGRAM
    ========================== */

    function renderClientProgram(
      programData
    ) {

      const days =
        Array.isArray(
          programData?.days
        )
          ? programData.days
          : [];


      if (
        days.length === 0
      ) {

        workoutDaysContainer.innerHTML = `

          <div class="no-program-message">

            <strong>
              Your training program has not been added yet.
            </strong>

            <p>
              Check back after your coach updates your program.
            </p>

          </div>

        `;


        return;

      }


      workoutDaysContainer.innerHTML =
        days
          .map(
            (
              day,
              dayIndex
            ) => {

              const exercises =
                Array.isArray(
                  day.exercises
                )
                  ? day.exercises
                  : [];


              const exercisesHtml =
                exercises
                  .map(
                    exercise => {

                      const exerciseName =
                        escapeHtml(
                          exercise.name
                        );


                      const sets =
                        escapeHtml(
                          exercise.sets
                        );


                      const reps =
                        escapeHtml(
                          exercise.reps
                        );


                      const note =
                        escapeHtml(
                          exercise.note
                        );


                      return `

                        <div class="exercise">

                          <h3>
                            ${exerciseName}
                          </h3>


                          <div class="exercise-prescription">
                            ${sets} × ${reps}
                          </div>


                          ${
                            note
                              ? `
                                <p class="exercise-note">
                                  ${note}
                                </p>
                              `
                              : ""
                          }

                        </div>

                      `;

                    }
                  )
                  .join("");


              return `

                <section
                  class="workout-day"
                  data-workout-day="${dayIndex + 1}"
                >

                  <div class="workout-day-header">

                    <h2>
                      Day ${dayIndex + 1}
                    </h2>

                    <p>
                      ${escapeHtml(
                        day.name
                      )}
                    </p>

                  </div>


                  <div class="exercise-list">

                    ${exercisesHtml}

                  </div>


                  <div class="workout-actions">

                    <button
                      type="button"
                      class="quick-log-button"
                      data-day="${dayIndex + 1}"
                    >
                      Quick Log Workout
                    </button>

                  </div>

                </section>

              `;

            }
          )
          .join("");

    }


    /* =========================
       LOAD PROGRAM FROM
       SUPABASE
    ========================== */

    async function loadClientProgram(
      userId
    ) {

      const {
        data,
        error
      } =
        await window.auth.supabase
          .from("programs")
          .select(
            "coach_notes, program_data"
          )
          .eq(
            "user_id",
            userId
          )
          .maybeSingle();


      if (error) {
        throw error;
      }


      /*
        No program assigned yet.
      */

      if (!data) {

        coachNotesDisplay.textContent =
          "Your coach has not added program notes yet.";


        renderClientProgram(
          {
            days: []
          }
        );


        return;

      }


      /*
        Display coach notes.
      */

      coachNotesDisplay.textContent =
        data.coach_notes ||
        "No additional notes from your coach.";


      /*
        Display workout days.
      */

      renderClientProgram(
        data.program_data
      );

    }


    /* =========================
       DATE HELPERS
    ========================== */

    function getTodayDate() {

      const date =
        new Date();


      date.setMinutes(
        date.getMinutes() -
        date.getTimezoneOffset()
      );


      return date
        .toISOString()
        .split("T")[0];

    }


    function formatLocalDate(
      date
    ) {

      const localDate =
        new Date(date);


      localDate.setMinutes(
        localDate.getMinutes() -
        localDate.getTimezoneOffset()
      );


      return localDate
        .toISOString()
        .split("T")[0];

    }


    function getCurrentWeekRange() {

      const today =
        new Date();


      const dayOfWeek =
        today.getDay();


      const daysSinceMonday =
        dayOfWeek === 0
          ? 6
          : dayOfWeek - 1;


      const monday =
        new Date(
          today
        );


      monday.setDate(
        today.getDate() -
        daysSinceMonday
      );


      const sunday =
        new Date(
          monday
        );


      sunday.setDate(
        monday.getDate() + 6
      );


      return {

        startDate:
          formatLocalDate(
            monday
          ),

        endDate:
          formatLocalDate(
            sunday
          )

      };

    }


    /* =========================
       SAVE DAILY WORKOUT
    ========================== */

    async function saveDailyWorkout(
      userId,
      workout
    ) {

      const logDate =
        getTodayDate();


      const {
        data: existingLog,
        error: readError
      } =
        await window.auth.supabase
          .from("daily_logs")
          .select(
            "workout"
          )
          .eq(
            "user_id",
            userId
          )
          .eq(
            "log_date",
            logDate
          )
          .maybeSingle();


      if (readError) {
        throw readError;
      }


      const wasAlreadyCompleted =
        existingLog?.workout !== null &&
        existingLog?.workout !== undefined &&
        existingLog?.workout !== "";


      const {
        error
      } =
        await window.auth.supabase
          .from("daily_logs")
          .upsert(
            {

              user_id:
                userId,

              log_date:
                logDate,

              workout:
                workout,

              updated_at:
                new Date().toISOString()

            },
            {

              onConflict:
                "user_id,log_date"

            }
          );


      if (error) {
        throw error;
      }


      return {

        isNewCompletion:
          !wasAlreadyCompleted

      };

    }


    /* =========================
       WEEKLY WORKOUT COUNT
    ========================== */

    async function getWeeklyWorkoutCount(
      userId
    ) {

      const {
        startDate,
        endDate
      } =
        getCurrentWeekRange();


      const {
        count,
        error
      } =
        await window.auth.supabase
          .from("daily_logs")
          .select(
            "*",
            {
              count: "exact",
              head: true
            }
          )
          .eq(
            "user_id",
            userId
          )
          .gte(
            "log_date",
            startDate
          )
          .lte(
            "log_date",
            endDate
          )
          .not(
            "workout",
            "is",
            null
          );


      if (error) {
        throw error;
      }


      return count || 0;

    }


    /* =========================
       ADD WORKOUT XP
    ========================== */

    async function addWorkoutXp(
      userId
    ) {

      const {
        data: progress,
        error: readError
      } =
        await window.auth.supabase
          .from("game_progress")
          .select(
            "current_level, current_xp"
          )
          .eq(
            "user_id",
            userId
          )
          .single();


      if (readError) {
        throw readError;
      }


      const requiredXpByLevel = {

        0: 70,

        1: 100,

        2: 280,

        3: 280,

        4: 280,

        5: 400,

        6: 400,

        7: 560

      };


      let newLevel =
        Number(
          progress.current_level
        );


      let newXp =
        Number(
          progress.current_xp
        ) + 20;


      const requiredXp =
        requiredXpByLevel[
          newLevel
        ] ?? 280;


      /*
        Level up and carry
        remaining XP forward.
      */

      if (
        newXp >= requiredXp &&
        newLevel < 7
      ) {

        newXp -=
          requiredXp;


        newLevel += 1;

      }


      /*
        Level 7 is the maximum.
      */

      if (
        newLevel === 7
      ) {

        newXp =
          Math.min(
            newXp,
            requiredXpByLevel[7]
          );

      }


      const {
        error: updateError
      } =
        await window.auth.supabase
          .from("game_progress")
          .update(
            {

              current_level:
                newLevel,

              current_xp:
                newXp,

              updated_at:
                new Date().toISOString()

            }
          )
          .eq(
            "user_id",
            userId
          );


      if (updateError) {
        throw updateError;
      }

    }


    /* =========================
       OPEN QUICK LOG
    ========================== */

    function openWorkoutLog(
      button
    ) {

      activeQuickLogButton =
        button;


      const workoutDay =
        button.closest(
          ".workout-day"
        );


      if (!workoutDay) {
        return;
      }


      const dayNumber =
        workoutDay.dataset.workoutDay;


      const workoutName =
        workoutDay.querySelector(
          ".workout-day-header p"
        )?.textContent.trim() ||
        "";


      const exercises =
        workoutDay.querySelectorAll(
          ".exercise"
        );


      let workoutText =
        `Day ${dayNumber}`;


      if (
        workoutName
      ) {

        workoutText +=
          `: ${workoutName}`;

      }


      workoutText +=
        "\n\n";


      exercises.forEach(
        exercise => {

          const exerciseName =
            exercise.querySelector(
              "h3"
            )?.textContent.trim();


          const prescription =
            exercise.querySelector(
              ".exercise-prescription"
            )?.textContent.trim();


          if (
            exerciseName &&
            prescription
          ) {

            workoutText +=
              `${exerciseName} — ${prescription}\n`;

          }

        }
      );


      workoutText +=
        "\nNotes:";


      workoutInput.value =
        workoutText;


      workoutLogPanel.classList.add(
        "active"
      );


      workoutInput.focus();

    }


    /* =========================
       QUICK LOG BUTTONS
       DYNAMIC EVENT LISTENER
    ========================== */

    workoutDaysContainer.addEventListener(
      "click",
      event => {

        const button =
          event.target.closest(
            ".quick-log-button"
          );


        if (!button) {
          return;
        }


        openWorkoutLog(
          button
        );

      }
    );


    /* =========================
       CLOSE QUICK LOG
    ========================== */

    function closeWorkoutLog() {

      workoutLogPanel.classList.remove(
        "active"
      );


      workoutInput.value =
        "";


      activeQuickLogButton =
        null;

    }


    /* =========================
       SAVE WORKOUT LOG
    ========================== */

    async function saveWorkoutLog() {

      const workout =
        workoutInput.value.trim();


      if (!workout) {

        alert(
          "Please enter your workout."
        );


        return;

      }


      try {

        const user =
          await window.auth.getUser();


        if (!user) {

          throw new Error(
            "User is not authenticated."
          );

        }


        const {
          isNewCompletion
        } =
          await saveDailyWorkout(
            user.id,
            workout
          );


        /*
          Award XP only on the first
          workout log for this date.
        */

        if (
          isNewCompletion
        ) {

          const weeklyCount =
            await getWeeklyWorkoutCount(
              user.id
            );


          /*
            Workout XP is capped at
            four days per week.
          */

          if (
            weeklyCount <= 4
          ) {

            await addWorkoutXp(
              user.id
            );

          }

        }


        /*
          Keep local workoutLogs
          synchronized with the
          existing game system.
        */

        const workoutLogs =
          JSON.parse(
            localStorage.getItem(
              "workoutLogs"
            ) || "[]"
          );


        const logDate =
          getTodayDate();


        const existingIndex =
          workoutLogs.findIndex(
            log =>
              log.date ===
              logDate
          );


        const workoutLog = {

          date:
            logDate,

          workout:
            workout

        };


        if (
          existingIndex === -1
        ) {

          workoutLogs.push(
            workoutLog
          );

        } else {

          workoutLogs[
            existingIndex
          ] =
            workoutLog;

        }


        localStorage.setItem(
          "workoutLogs",
          JSON.stringify(
            workoutLogs
          )
        );


        closeWorkoutLog();


      } catch (error) {

        console.error(
          "Could not save workout:",
          error
        );


        alert(
          "Your workout could not be saved. Please try again."
        );

      }

    }


    /* =========================
       WORKOUT LOG BUTTONS
    ========================== */

    saveWorkoutBtn.addEventListener(
      "click",
      saveWorkoutLog
    );


    cancelWorkoutLogBtn.addEventListener(
      "click",
      closeWorkoutLog
    );


    workoutInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();


          saveWorkoutLog();

        }

      }
    );


    /* =========================
       INITIALIZE PAGE
    ========================== */

    async function initializePage() {

      try {

        const user =
          await window.auth.requireAuth();


        if (!user) {
          return;
        }


        /*
          Display the logged-in
          client's name.
        */

        await loadClientName(
          user.id
        );


        /*
          Load the exact program
          saved by their coach.
        */

        await loadClientProgram(
          user.id
        );


      } catch (error) {

        console.error(
          "Could not initialize program page:",
          error
        );


        coachNotesDisplay.textContent =
          "Your program could not be loaded.";

      }

    }


    initializePage();

  </script>


</body>
