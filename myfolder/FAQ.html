  <style>

    .faq-page {
      width: 90%;
      max-width: 900px;
      margin: 40px auto;
    }

    .faq-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .faq-header h1 {
      margin-bottom: 10px;
    }

    .faq-section {
      background: var(--card, #ffffff);
      border: 3px solid var(--border, #111111);
      padding: 24px;
      margin-bottom: 28px;
      box-sizing: border-box;
    }

    .faq-section > h2 {
      margin-top: 0;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }


    /* =========================
       GETTING STARTED CARDS
    ========================== */

    .faq-starting-cards {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 500px;
      margin: 25px auto;
    }

    .faq-starting-button {
      width: 100%;
      min-height: 70px;

      border: 3px solid var(--border, #111111);

      background: var(--card, #ffffff);
      color: var(--fg, #111111);

      padding: 14px;

      font-family: "Atkinson Hyperlegible", sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;

      cursor: pointer;

      box-shadow: 5px 5px 0 var(--fg, #111111);

      transition: 0.1s ease;
    }

    .faq-starting-button:hover {
      transform: translate(2px, 2px);
      box-shadow: 3px 3px 0 var(--fg, #111111);
    }


    /* =========================
       VERTICAL LEVEL FLOW
    ========================== */

    .faq-level-flow {
      display: flex;
      flex-direction: column;

      gap: 18px;

      width: 100%;
      max-width: 500px;

      margin: 25px auto;
    }


    .faq-level-button {
      position: relative;

      width: 100%;
      min-height: 90px;

      border: 3px solid var(--border, #111111);

      background: var(--card, #ffffff);
      color: var(--fg, #111111);

      padding: 14px;

      font-family: "Atkinson Hyperlegible", sans-serif;

      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;

      cursor: pointer;

      box-shadow: 5px 5px 0 var(--fg, #111111);

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      gap: 6px;

      transition: 0.1s ease;
    }


    .faq-level-button::after {
      content: "";

      position: absolute;

      width: 4px;
      height: 18px;

      background: var(--fg, #111111);

      left: 50%;
      bottom: -21px;

      transform: translateX(-50%);
    }


    .faq-level-button:last-child::after {
      display: none;
    }


    .faq-level-button:hover:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: 3px 3px 0 var(--fg, #111111);
    }


    .faq-level-button.available {
      background: var(--fg, #111111);
      color: var(--card, #ffffff);
    }


    .faq-level-button.future {
      opacity: 0.45;
      cursor: default;
    }


    .faq-level-button.future::before {
      content: "COMING SOON";

      position: absolute;

      right: 12px;
      top: 8px;

      font-size: 10px;
      letter-spacing: 1px;
    }


    .faq-level-number {
      font-size: 13px;
    }

    .faq-level-name {
      font-size: 18px;
    }


    /* =========================
       FAQ MODAL
    ========================== */

    #faqLevelModal {
      z-index: 5000;
    }


    @media (max-width: 600px) {

      .faq-page {
        width: 92%;
        margin: 24px auto;
      }

      .faq-section {
        padding: 18px;
      }

      .faq-level-flow,
      .faq-starting-cards {
        max-width: 100%;
      }

    .faq-level-instructions {
      margin-top: -8px;
      margin-bottom: 24px;
      color: #555;
      font-size: 15px;
      text-align: center;
    }

            </p>


            <h3>
              Weekly XP Caps
            </h3>

            <p>
              Each objective has a weekly XP cap.
            </p>

            <p>
              This means you can't earn all of your XP in
              a single day or finish an entire level before
              the week is over.
            </p>

            <p>
              You're still encouraged to log extra workouts,
              meals, or healthy habits. They simply won't

            </p>

      },


      /* =========================
         LEVEL 2: EXPLORE
      ========================== */

      2: {

        title: "Welcome to Explore!",

        duration: "2 Weeks • 280 XP",

        objectives: [

          {
            name: "Weight",
            days: "6 Days"
          },

          {
            name: "Workout",
            days: "4 Days"
          },

          {
            name: "Protein",
            days: "6 Days"
          }

        ],

        paragraphs: [

          `
You've spent the last level building
consistency. Now we're going to start learning
what types of training work best for you.
          `,

          `
For the next two weeks, <strong>use the Workouts page
to explore different exercises and equipment.</strong>
Pay attention to which exercises you enjoy,
which feel comfortable, which feel
challenging, and which you would prefer not
to include in your training.
          `,


          `
<strong>Log each workout with the exercises you
completed,</strong> including your sets and reps when
possible.
          `,


          `
I will use your workout logs during Explore
to help build your programming in the next
level.
          `,

          `
You are not expected to have everything
figured out yet. The purpose of Explore is to
try different options and give us the
information we need to create a more
structured training plan.
          `

        ],

takeaway: `
  "fitness gets easier when you stop asking,<br>
  'what's the fastest way?'<br>
  and start asking,<br>
  'what can I repeat?'"<br><br>
  — RP Strength
`,

        dropdowns: [

          {

            title: "How to Log Your Workouts",

            paragraphs: [

              `

during Explore because I will use them when

              `,

              `
Instead of writing:
"Did glute workout"
              `,

              `
Try something like:<br><br>

<strong>Warm-up:</strong> 5 min treadmill<br>
<strong>Lower Back Extensions:</strong> 3 × 12<br>

              `,

              `

              `

            ]

          },


          {

            title: "Looking for More Structure?",

            paragraphs: [

              `
You have flexibility during Explore, but if
walking into the gym without a plan feels
overwhelming, you can use a basic four-day

              `,

              `
Day 1: Legs
              `,

              `
Day 2: Back + Biceps
              `,

              `
Day 3: Glutes
              `,

              `
Day 4: Chest + Shoulders
              `,

              `

              `

            ]

          },


          {

            title: "Some Tips",

            paragraphs: [

              `

              `,

              `

              `

    /* =========================
       FAQ MODAL ELEMENTS
    ========================== */

    const faqLevelModal =
      document.getElementById(
        "faqLevelModal"
      );

    const faqModalLabel =
      document.getElementById(
        "faqModalLabel"
      );

    const faqLevelTitle =
      document.getElementById(
        "faqLevelTitle"
      );

    const faqLevelContent =
      document.getElementById(
        "faqLevelContent"
      );

    const closeFaqLevelBtn =
      document.getElementById(
        "closeFaqLevelBtn"
      );

    const faqLevelButtons =
      document.querySelectorAll(
        ".faq-level-button"
      );

    const faqStartingButtons =
      document.querySelectorAll(
        ".faq-starting-button"
      );


    /* =========================
       OPEN GETTING STARTED CARD
    ========================== */

    faqStartingButtons.forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            const guideName =
              button.dataset.guide;

            const guideContent =
              gettingStartedContent[
                guideName
              ];


            if (!guideContent) {
              return;
            }


            faqModalLabel.textContent =
              "OUTLIERS GUIDE";


            faqLevelTitle.textContent =
              guideContent.title;


            faqLevelContent.innerHTML =
              guideContent.html;


            faqLevelModal.classList.add(
              "active"
            );


            faqLevelModal.setAttribute(
              "aria-hidden",
              "false"
            );

          }
        );

      }
    );


    /* =========================
       RENDER LEVEL CARD
    ========================== */

    function renderFaqLevelCard(
      cardContent
    ) {

      if (!cardContent) {
        return;
      }


      const objectivesHtml =
        cardContent.objectives
          .map(objective => {

            return `
              <div class="level-objective">

                <span>
                  ${objective.name}
                </span>

                <strong>
                  ${objective.days}
                </strong>

              </div>
            `;

          })
          .join("");


      const paragraphsHtml =
        cardContent.paragraphs
          .map(paragraph => {

            return `
              <p>
                ${paragraph.trim()}
              </p>
            `;

          })
          .join("");


      const dropdownsHtml =
        cardContent.dropdowns
          .map(dropdown => {

            const dropdownParagraphs =
              dropdown.paragraphs
                .map(paragraph => {

                  return `
                    <p>
                      ${paragraph.trim()}
                    </p>
                  `;

                })
                .join("");


            return `
              <details class="lesson-dropdown">

                <summary>
                  ${dropdown.title}
                </summary>

                <div
                  class="lesson-dropdown-content"
                >

                  ${dropdownParagraphs}

                </div>

              </details>
            `;

          })
          .join("");


      faqLevelContent.innerHTML = `

        <div class="next-level-duration">
          ${cardContent.duration}
        </div>


        <div class="next-level-section">

          <h3>
            Weekly Objectives
          </h3>

          <div class="level-objectives">
            ${objectivesHtml}
          </div>

        </div>


        <div class="next-level-copy">
          ${paragraphsHtml}
        </div>


        <div class="next-level-takeaway">
          ${cardContent.takeaway}
        </div>


        <div class="next-level-lessons">
          ${dropdownsHtml}
        </div>

      `;

    }


    /* =========================
       OPEN LEVEL CARD
    ========================== */

    faqLevelButtons.forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            if (button.disabled) {
              return;
            }


            const levelNumber =
              Number(
                button.dataset.level
              );


            const cardContent =
              levelIntroContent[
                levelNumber
              ];


            if (!cardContent) {
              return;
            }


            faqModalLabel.textContent =
              "LEVEL GUIDE";


            faqLevelTitle.textContent =
              cardContent.title;


            renderFaqLevelCard(
              cardContent
            );


            faqLevelModal.classList.add(
              "active"
            );


            faqLevelModal.setAttribute(
              "aria-hidden",
              "false"
            );

          }
        );

      }
    );


    /* =========================
       CLOSE CARD
    ========================== */

    if (closeFaqLevelBtn) {

      closeFaqLevelBtn.addEventListener(
        "click",
        () => {

          faqLevelModal.classList.remove(
            "active"
          );

          faqLevelModal.setAttribute(
            "aria-hidden",
            "true"
          );

        }
      );

    }


    /*
      Also close the modal when the user clicks
      outside of the card.
    */

    if (faqLevelModal) {

      faqLevelModal.addEventListener(
        "click",
        event => {

          if (
            event.target ===
            faqLevelModal
          ) {

            faqLevelModal.classList.remove(
              "active"
            );

            faqLevelModal.setAttribute(
              "aria-hidden",
              "true"
            );

          }

        }
      );

    }


    /* =========================
       REQUIRE LOGIN
    ========================== */

    async function initializePage() {

      try {

        const user =
          await window.auth.requireAuth();

        if (!user) {
          return;
        }

      } catch (error) {

        console.error(
          "Could not initialize FAQ page:",
          error
        );

      }

    }


    initializePage();

  </script>


</body>
