<!DOCTYPE html>
<html lang="en">

<head>

  <!-- =========================
       PAGE SETUP
  ========================== -->

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Client Program | Outliers Training Club</title>


  <!-- =========================
       FONT
  ========================== -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap"
    rel="stylesheet"
  >


  <!-- =========================
       CSS
  ========================== -->

  <link
    rel="stylesheet"
    href="/myfolder/CSS/base.css"
  >

  <link
    rel="stylesheet"
    href="/myfolder/CSS/index.css"
  >

  <link
    rel="stylesheet"
    href="/myfolder/CSS/styles.css"
  >


  <!-- =========================
       PROGRAM PAGE CSS
  ========================== -->

  <style>

    /* =========================
       PAGE
    ========================== */

    .program-page {
      width: 90%;
      max-width: 900px;
      margin: 40px auto;
    }


    .program-header {
      text-align: center;
      margin-bottom: 35px;
    }


    .program-header h1 {
      margin-bottom: 8px;
    }


    .program-header p {
      margin: 0;
    }


    /* =========================
       FORM FIELDS
    ========================== */

    .program-page label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
    }


    .program-page input,
    .program-page textarea {
      width: 100%;
      box-sizing: border-box;
      border: 2px solid var(--border, #111111);
      background: var(--card, #ffffff);
      color: var(--fg, #111111);
      font: inherit;
      padding: 10px;
    }


    .program-page textarea {
      resize: vertical;
      min-height: 90px;
    }


    .program-page input:focus,
    .program-page textarea:focus {
      outline: 2px solid var(--border, #111111);
      outline-offset: 2px;
    }


    /* =========================
       PROGRAM INFO
    ========================== */

    .program-info {
      background: var(--card, #ffffff);
      border: 3px solid var(--border, #111111);
      padding: 20px;
      margin-bottom: 28px;
      box-sizing: border-box;
    }


    .program-info h2 {
      margin-top: 0;
      margin-bottom: 12px;
    }


    /* =========================
       WORKOUT DAYS
    ========================== */

    .workout-day {
      background: var(--card, #ffffff);
      border: 3px solid var(--border, #111111);
      margin-bottom: 28px;
      box-sizing: border-box;
    }


    .workout-day-header {
      border-bottom: 3px solid var(--border, #111111);
      padding: 16px 20px;
    }


    .workout-day-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }


    .workout-day-header h2 {
      margin: 0;
    }


    .day-name-input {
      max-width: 420px;
    }


    /* =========================
       EXERCISES
    ========================== */

    .exercise-list {
      padding: 20px;
    }


    .exercise {
      padding: 16px 0;
    }


    .exercise:first-child {
      padding-top: 0;
    }


    .exercise:last-child {
      padding-bottom: 0;
    }


    .exercise-grid {
      display: grid;
      grid-template-columns: 1fr 110px 110px;
      gap: 12px;
      align-items: end;
    }


    .exercise-note-field {
      margin-top: 12px;
    }


    .exercise-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 10px;
    }


    /* =========================
       BUTTONS
    ========================== */

    .program-editor-button {
      display: inline-block;
      border: 2px solid var(--border, #111111);
      background: var(--card, #ffffff);
      color: var(--fg, #111111);
      font: inherit;
      font-weight: 700;
      padding: 9px 14px;
      cursor: pointer;
    }


    .program-editor-button:hover {
      background: var(--hover, #ece9e6);
    }


    .remove-button {
      padding: 7px 10px;
    }


    .add-exercise-row {
      padding: 0 20px 20px;
      text-align: center;
    }


    .program-bottom-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin: 30px 0;
    }


    .save-program-button {
      min-width: 190px;
    }


    .save-status {
      min-height: 24px;
      margin: 0;
      text-align: center;
      font-weight: 700;
    }


    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 600px) {

      .program-page {
        width: 92%;
        margin: 24px auto;
      }


      .program-info {
        padding: 16px;
      }


      .workout-day-header {
        padding: 14px 16px;
      }


      .workout-day-header-row {
        align-items: flex-start;
      }


      .exercise-list {
        padding: 16px;
      }


      .exercise-grid {
        grid-template-columns: 1fr 1fr;
      }


      .exercise-name-field {
        grid-column: 1 / -1;
      }


      .add-exercise-row {
        padding: 0 16px 16px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       NAVIGATION
  ========================== -->

  <nav id="mainNav">

    <a href="/myfolder/template.html">
      Home
    </a>

    <a href="/myfolder/coach.html">
      Coach Dashboard
    </a>

    <a href="/myfolder/workouts.html">
      Workouts
    </a>

    <a href="/myfolder/meal_planner.html">
      Meal Planner
    </a>

    <a href="/myfolder/cart.html">
      Grocery List
    </a>


    <span id="hamburger">
      &#9776;
    </span>


    <div id="mobile-menu">

      <a href="/myfolder/template.html">
        Home
      </a>

      <a href="/myfolder/coach.html">
        Coach Dashboard
      </a>

      <a href="/myfolder/workouts.html">
        Workouts
      </a>

      <a href="/myfolder/meal_planner.html">
        Meal Planner
      </a>

      <a href="/myfolder/cart.html">
        Grocery List
      </a>

    </div>

  </nav>


  <!-- =========================
       MAIN PAGE
  ========================== -->

  <main>

    <section class="program-page">


      <!-- =========================
           PAGE HEADER
      ========================== -->

      <div class="program-header">

        <h1 id="clientProgramHeading">
          Client Program
        </h1>

        <p>
          View and manage this client's current training program.
        </p>

      </div>


      <!-- =========================
           PROGRAM INFO
      ========================== -->

      <section class="program-info">

        <h2>
          Notes from Coach
        </h2>

        <label for="coachNotes">
          Program Notes
        </label>

        <textarea
          id="coachNotes"
          placeholder="Add notes about the client's current program..."
        >Your program notes will go here.</textarea>

      </section>


      <!-- =========================
           WORKOUT DAYS
      ========================== -->

      <div id="workoutDaysContainer"></div>


      <!-- =========================
           PROGRAM ACTIONS
      ========================== -->

      <div class="program-bottom-actions">

        <button
          type="button"
          class="program-editor-button"
          id="addWorkoutDayBtn"
        >
          + Add Workout Day
        </button>

        <button
          type="button"
          class="program-editor-button save-program-button"
          id="saveProgramBtn"
        >
          Save Program
        </button>

        <p
          class="save-status"
          id="saveStatus"
        ></p>

      </div>


    </section>

  </main>


  <!-- =========================
       FOOTER
  ========================== -->

  <footer>
    OUTLIERS TRAINING CLUB © 2026
  </footer>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script
    src="/myfolder/js/auth.js?v=10"
  ></script>


  <script>

    /* =========================
       MOBILE NAVIGATION
    ========================== */

    const hamburger =
      document.getElementById(
        "hamburger"
      );

    const mobileMenu =
      document.getElementById(
        "mobile-menu"
      );


    if (hamburger && mobileMenu) {

      hamburger.addEventListener(
        "click",
        () => {

          mobileMenu.style.display =
            mobileMenu.style.display === "flex"
              ? "none"
              : "flex";

        }
      );

    }


    /* =========================
       CLIENT ID FROM URL
    ========================== */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const clientId =
      params.get("client");


    /* =========================
       EDITOR ELEMENTS
    ========================== */

    const workoutDaysContainer =
      document.getElementById(
        "workoutDaysContainer"
      );

    const coachNotes =
      document.getElementById(
        "coachNotes"
      );

    const addWorkoutDayBtn =
      document.getElementById(
        "addWorkoutDayBtn"
      );

    const saveProgramBtn =
      document.getElementById(
        "saveProgramBtn"
      );

    const saveStatus =
      document.getElementById(
        "saveStatus"
      );


    /* =========================
       DEFAULT PROGRAM
    ========================== */

    let programData = {

      days: [

        {
          name: "Legs",
          exercises: [
            {
              name: "Squat",
              sets: 3,
              reps: 8,
              note: "Coach note will go here."
            },
            {
              name: "Romanian Deadlift",
              sets: 3,
              reps: 10,
              note: "Coach note will go here."
            },
            {
              name: "Leg Extension",
              sets: 3,
              reps: 12,
              note: "Coach note will go here."
            }
          ]
        },

        {
          name: "Back + Biceps",
          exercises: [
            {
              name: "Lat Pulldown",
              sets: 3,
              reps: 10,
              note: "Coach note will go here."
            },
            {
              name: "Seated Cable Row",
              sets: 3,
              reps: 10,
              note: "Coach note will go here."
            },
            {
              name: "Dumbbell Curl",
              sets: 3,
              reps: 12,
              note: "Coach note will go here."
            }
          ]
        },

        {
          name: "Glutes",
          exercises: [
            {
              name: "Hip Thrust",
              sets: 3,
              reps: 10,
              note: "Coach note will go here."
            },
            {
              name: "Glute Kickback",
              sets: 3,
              reps: 12,
              note: "Coach note will go here."
            },
            {
              name: "Hip Abductor",
              sets: 3,
              reps: 12,
              note: "Coach note will go here."
            }
          ]
        },

        {
          name: "Chest + Shoulders",
          exercises: [
            {
              name: "Dumbbell Bench Press",
              sets: 3,
              reps: 10,
              note: "Coach note will go here."
            },
            {
              name: "Shoulder Press",
              sets: 3,
              reps: 10,
              note: "Coach note will go here."
            },
            {
              name: "Lateral Raise",
              sets: 3,
              reps: 12,
              note: "Coach note will go here."
            }
          ]
        }

      ]

    };


    /* =========================
       HTML ESCAPING
    ========================== */

    function escapeHtml(value) {

      return String(
        value ?? ""
      )
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    /* =========================
       RENDER PROGRAM EDITOR
    ========================== */

    function renderProgramEditor() {

      workoutDaysContainer.innerHTML =
        programData.days
          .map(
            (
              day,
              dayIndex
            ) => {

              const exercisesHtml =
                day.exercises
                  .map(
                    (
                      exercise,
                      exerciseIndex
                    ) => `
                      <div
                        class="exercise"
                        data-exercise-index="${exerciseIndex}"
                      >

                        <div class="exercise-grid">

                          <div class="exercise-name-field">

                            <label>
                              Exercise
                            </label>

                            <input
                              type="text"
                              class="exercise-name-input"
                              value="${escapeHtml(
                                exercise.name
                              )}"
                              data-day-index="${dayIndex}"
                              data-exercise-index="${exerciseIndex}"
                            >

                          </div>


                          <div>

                            <label>
                              Sets
                            </label>

                            <input
                              type="number"
                              min="0"
                              class="exercise-sets-input"
                              value="${escapeHtml(
                                exercise.sets
                              )}"
                              data-day-index="${dayIndex}"
                              data-exercise-index="${exerciseIndex}"
                            >

                          </div>


                          <div>

                            <label>
                              Reps
                            </label>

                            <input
                              type="text"
                              class="exercise-reps-input"
                              value="${escapeHtml(
                                exercise.reps
                              )}"
                              data-day-index="${dayIndex}"
                              data-exercise-index="${exerciseIndex}"
                            >

                          </div>

                        </div>


                        <div class="exercise-note-field">

                          <label>
                            Coach Note
                          </label>

                          <textarea
                            class="exercise-note-input"
                            data-day-index="${dayIndex}"
                            data-exercise-index="${exerciseIndex}"
                            placeholder="Optional note for this exercise..."
                          >${escapeHtml(
                            exercise.note
                          )}</textarea>

                        </div>


                        <div class="exercise-actions">

                          <button
                            type="button"
                            class="program-editor-button remove-button remove-exercise-btn"
                            data-day-index="${dayIndex}"
                            data-exercise-index="${exerciseIndex}"
                          >
                            Remove Exercise
                          </button>

                        </div>

                      </div>
                    `
                  )
                  .join("");


              return `
                <section
                  class="workout-day"
                  data-workout-day="${dayIndex + 1}"
                >

                  <div class="workout-day-header">

                    <div class="workout-day-header-row">

                      <h2>
                        Day ${dayIndex + 1}
                      </h2>

                      <button
                        type="button"
                        class="program-editor-button remove-button remove-day-btn"
                        data-day-index="${dayIndex}"
                      >
                        Remove Day
                      </button>

                    </div>


                    <label>
                      Workout Name
                    </label>

                    <input
                      type="text"
                      class="day-name-input"
                      value="${escapeHtml(
                        day.name
                      )}"
                      data-day-index="${dayIndex}"
                      placeholder="Example: Legs"
                    >

                  </div>


                  <div class="exercise-list">

                    ${exercisesHtml}

                  </div>


                  <div class="add-exercise-row">

                    <button
                      type="button"
                      class="program-editor-button add-exercise-btn"
                      data-day-index="${dayIndex}"
                    >
                      + Add Exercise
                    </button>

                  </div>

                </section>
              `;

            }
          )
          .join("");

    }


    /* =========================
       KEEP DATA IN SYNC
    ========================== */

    workoutDaysContainer.addEventListener(
      "input",
      event => {

        const target =
          event.target;

        const dayIndex =
          Number(
            target.dataset.dayIndex
          );

        const exerciseIndex =
          Number(
            target.dataset.exerciseIndex
          );


        if (
          target.classList.contains(
            "day-name-input"
          )
        ) {

          programData.days[
            dayIndex
          ].name =
            target.value;

          return;

        }


        if (
          !Number.isInteger(
            exerciseIndex
          )
        ) {
          return;
        }


        const exercise =
          programData.days[
            dayIndex
          ]?.exercises[
            exerciseIndex
          ];


        if (!exercise) {
          return;
        }


        if (
          target.classList.contains(
            "exercise-name-input"
          )
        ) {

          exercise.name =
            target.value;

        }


        if (
          target.classList.contains(
            "exercise-sets-input"
          )
        ) {

          exercise.sets =
            target.value;

        }


        if (
          target.classList.contains(
            "exercise-reps-input"
          )
        ) {

          exercise.reps =
            target.value;

        }


        if (
          target.classList.contains(
            "exercise-note-input"
          )
        ) {

          exercise.note =
            target.value;

        }

      }
    );


    /* =========================
       ADD / REMOVE
    ========================== */

    workoutDaysContainer.addEventListener(
      "click",
      event => {

        const button =
          event.target.closest(
            "button"
          );


        if (!button) {
          return;
        }


        const dayIndex =
          Number(
            button.dataset.dayIndex
          );


        if (
          button.classList.contains(
            "add-exercise-btn"
          )
        ) {

          programData.days[
            dayIndex
          ].exercises.push(
            {
              name: "",
              sets: 3,
              reps: 10,
              note: ""
            }
          );


          renderProgramEditor();

          return;

        }


        if (
          button.classList.contains(
            "remove-exercise-btn"
          )
        ) {

          const exerciseIndex =
            Number(
              button.dataset.exerciseIndex
            );


          programData.days[
            dayIndex
          ].exercises.splice(
            exerciseIndex,
            1
          );


          renderProgramEditor();

          return;

        }


        if (
          button.classList.contains(
            "remove-day-btn"
          )
        ) {

          programData.days.splice(
            dayIndex,
            1
          );


          renderProgramEditor();

        }

      }
    );


    addWorkoutDayBtn.addEventListener(
      "click",
      () => {

        programData.days.push(
          {
            name: "",
            exercises: [
              {
                name: "",
                sets: 3,
                reps: 10,
                note: ""
              }
            ]
          }
        );


        renderProgramEditor();

      }
    );


    /* =========================
       LOAD CLIENT NAME
    ========================== */

    async function loadClientName() {

      const {
        data,
        error
      } =
        await window.auth.supabase
          .from("profiles")
          .select("display_name")
          .eq(
            "id",
            clientId
          )
          .single();


      if (error) {
        throw error;
      }


      const displayName =
        data?.display_name ||
        "Client";


      document.getElementById(
        "clientProgramHeading"
      ).textContent =
        `${displayName}'s Program`;

    }


    /* =========================
       LOAD CLIENT PROGRAM
    ========================== */

    async function loadClientProgram() {

      /*
        NEXT STEP:

        Once the Supabase "programs"
        table exists, this function
        will retrieve:

        - coach_notes
        - program_data

        for clientId.

        Until then, the default
        program above is loaded into
        the editor.
      */

      console.log(
        "Selected client program:",
        clientId
      );


      renderProgramEditor();

    }


    /* =========================
       SAVE PROGRAM
    ========================== */

    async function saveProgram() {

      /*
        The editor is fully functional,
        but Supabase saving is intentionally
        not connected yet.

        Once the programs table exists,
        this is where we will upsert:

        {
          user_id: clientId,
          coach_notes: coachNotes.value,
          program_data: programData,
          updated_at: new Date().toISOString()
        }
      */

      console.log(
        "Program ready to save:",
        {
          user_id: clientId,
          coach_notes:
            coachNotes.value,
          program_data:
            programData
        }
      );


      saveStatus.textContent =
        "Program is ready — connect the programs table to save it.";

    }


    saveProgramBtn.addEventListener(
      "click",
      saveProgram
    );


    /* =========================
       INITIALIZE PAGE
    ========================== */

    async function initializePage() {

      try {

        /*
          This authenticates YOU,
          the logged-in coach.

          It does NOT change clientId.
        */

        const user =
          await window.auth.requireAuth();


        if (!user) {
          return;
        }


        /*
          Make sure a client was
          actually supplied in the URL.
        */

        if (!clientId) {

          document.getElementById(
            "clientProgramHeading"
          ).textContent =
            "Client Not Found";


          throw new Error(
            "No client ID was provided in the URL."
          );

        }


        /*
          Load the selected client's
          display name.
        */

        await loadClientName();


        /*
          Load the editable program.
        */

        await loadClientProgram();


      } catch (error) {

        console.error(
          "Could not initialize client program page:",
          error
        );


        document.getElementById(
          "clientProgramHeading"
        ).textContent =
          "Client Program Could Not Load";

      }

    }


    initializePage();

  </script>


</body>

</html>
