<!DOCTYPE html>
<html lang="en">

<head>

  <!-- =========================
       PAGE SETUP
  ========================== -->

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Client Program | Outliers Training Club</title>


  <!-- =========================
       FONT
  ========================== -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap"
    rel="stylesheet"
  >


  <!-- =========================
       CSS
  ========================== -->

  <link
    rel="stylesheet"
    href="/myfolder/CSS/base.css"
  >

  <link
    rel="stylesheet"
    href="/myfolder/CSS/index.css"
  >

  <link
    rel="stylesheet"
    href="/myfolder/CSS/styles.css"
  >


  <!-- =========================
       PROGRAM PAGE CSS
  ========================== -->

  <style>

    /* =========================
       PAGE
    ========================== */

    .program-page {
      width: 90%;
      max-width: 900px;
      margin: 40px auto;
    }


    .program-header {
      text-align: center;
      margin-bottom: 35px;
    }


    .program-header h1 {
      margin-bottom: 8px;
    }


    .program-header p {
      margin: 0;
    }


    /* =========================
       FORM FIELDS
    ========================== */

    .program-page label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
    }


    .program-page input,
    .program-page textarea {
      width: 100%;
      box-sizing: border-box;

      border: 2px solid var(--border, #111111);

      background: var(--card, #ffffff);
      color: var(--fg, #111111);

      font: inherit;

      padding: 10px;
    }


    .program-page textarea {
      resize: vertical;
      min-height: 90px;
    }


    .program-page input:focus,
    .program-page textarea:focus {
      outline: 2px solid var(--border, #111111);
      outline-offset: 2px;
    }


    /* =========================
       PROGRAM INFO
    ========================== */

    .program-info {
      background: var(--card, #ffffff);

      border: 3px solid var(--border, #111111);

      padding: 20px;

      margin-bottom: 28px;

      box-sizing: border-box;
    }


    .program-info h2 {
      margin-top: 0;
      margin-bottom: 12px;
    }


    /* =========================
       WORKOUT DAYS
    ========================== */

    .workout-day {
      background: var(--card, #ffffff);

      border: 3px solid var(--border, #111111);

      margin-bottom: 28px;

      box-sizing: border-box;
    }


    .workout-day-header {
      border-bottom: 3px solid var(--border, #111111);

      padding: 16px 20px;
    }


    .workout-day-header-row {
      display: flex;

      justify-content: space-between;
      align-items: center;

      gap: 12px;

      margin-bottom: 12px;
    }


    .workout-day-header h2 {
      margin: 0;
    }


    .day-name-input {
      max-width: 420px;
    }


    /* =========================
       EXERCISES
    ========================== */

    .exercise-list {
      padding: 20px;
    }


    .exercise {
      padding: 16px 0;
    }


    .exercise:first-child {
      padding-top: 0;
    }


    .exercise:last-child {
      padding-bottom: 0;
    }


    .exercise-grid {
      display: grid;

      grid-template-columns:
        1fr 110px 110px;

      gap: 12px;

      align-items: end;
    }


    .exercise-note-field {
      margin-top: 12px;
    }


    .exercise-actions {
      display: flex;

      justify-content: flex-end;

      margin-top: 10px;
    }


    /* =========================
       BUTTONS
    ========================== */

    .program-editor-button {
      display: inline-block;

      border: 2px solid var(--border, #111111);

      background: var(--card, #ffffff);
      color: var(--fg, #111111);

      font: inherit;
      font-weight: 700;

      padding: 9px 14px;

      cursor: pointer;
    }


    .program-editor-button:hover {
      background: var(--hover, #ece9e6);
    }


    .remove-button {
      padding: 7px 10px;
    }


    .add-exercise-row {
      padding: 0 20px 20px;

      text-align: center;
    }


    .program-bottom-actions {
      display: flex;

      flex-direction: column;
      align-items: center;

      gap: 16px;

      margin: 30px 0;
    }


    .save-program-button {
      min-width: 190px;

      background: var(--fg, #111111);
      color: var(--card, #ffffff);
    }


    .save-status {
      min-height: 24px;

      margin: 0;

      text-align: center;

      font-weight: 700;
    }


    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 600px) {

      .program-page {
        width: 92%;
        margin: 24px auto;
      }


      .program-info {
        padding: 16px;
      }


      .workout-day-header {
        padding: 14px 16px;
      }


      .workout-day-header-row {
        align-items: flex-start;
      }


      .exercise-list {
        padding: 16px;
      }


      .exercise-grid {
        grid-template-columns:
          1fr 1fr;
      }


      .exercise-name-field {
        grid-column: 1 / -1;
      }


      .add-exercise-row {
        padding: 0 16px 16px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       NAVIGATION
  ========================== -->

  <nav id="mainNav">

    <a href="/myfolder/template.html">
      Home
    </a>

    <a href="/myfolder/coach.html">
      Coach Dashboard
    </a>

    <a href="/myfolder/workouts.html">
      Workouts
    </a>

    <a href="/myfolder/meal_planner.html">
      Meal Planner
    </a>

    <a href="/myfolder/cart.html">
      Grocery List
    </a>


    <span id="hamburger">
      &#9776;
    </span>


    <div id="mobile-menu">

      <a href="/myfolder/template.html">
        Home
      </a>

      <a href="/myfolder/coach.html">
        Coach Dashboard
      </a>

      <a href="/myfolder/workouts.html">
        Workouts
      </a>

      <a href="/myfolder/meal_planner.html">
        Meal Planner
      </a>

      <a href="/myfolder/cart.html">
        Grocery List
      </a>

    </div>

  </nav>


  <!-- =========================
       MAIN PAGE
  ========================== -->

  <main>

    <section class="program-page">


      <!-- =========================
           PAGE HEADER
      ========================== -->

      <div class="program-header">

        <h1 id="clientProgramHeading">
          Client Program
        </h1>

        <p>
          View and manage this client's current training program.
        </p>

      </div>


      <!-- =========================
           PROGRAM INFO
      ========================== -->

      <section class="program-info">

        <h2>
          Notes from Coach
        </h2>

        <label for="coachNotes">
          Program Notes
        </label>

        <textarea
          id="coachNotes"
          placeholder="Add notes about the client's current program..."
        ></textarea>

      </section>


      <!-- =========================
           WORKOUT DAYS
      ========================== -->

      <div id="workoutDaysContainer"></div>


      <!-- =========================
           PROGRAM ACTIONS
      ========================== -->

      <div class="program-bottom-actions">

        <button
          type="button"
          class="program-editor-button"
          id="addWorkoutDayBtn"
        >
          + Add Workout Day
        </button>


        <button
          type="button"
          class="program-editor-button save-program-button"
          id="saveProgramBtn"
        >
          Save Program
        </button>


        <p
          class="save-status"
          id="saveStatus"
        ></p>

      </div>


    </section>

  </main>


  <!-- =========================
       FOOTER
  ========================== -->

  <footer>
    OUTLIERS TRAINING CLUB © 2026
  </footer>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script
    src="/myfolder/js/auth.js?v=10"
  ></script>


  <script>

    /* =========================
       MOBILE NAVIGATION
    ========================== */

    const hamburger =
      document.getElementById(
        "hamburger"
      );

    const mobileMenu =
      document.getElementById(
        "mobile-menu"
      );


    if (
      hamburger &&
      mobileMenu
    ) {

      hamburger.addEventListener(
        "click",
        () => {

          mobileMenu.style.display =
            mobileMenu.style.display === "flex"
              ? "none"
              : "flex";

        }
      );

    }


    /* =========================
       CLIENT ID FROM URL
    ========================== */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const clientId =
      params.get("client");


    /* =========================
       PAGE ELEMENTS
    ========================== */

    const workoutDaysContainer =
      document.getElementById(
        "workoutDaysContainer"
      );


    const coachNotes =
      document.getElementById(
        "coachNotes"
      );


    const addWorkoutDayBtn =
      document.getElementById(
        "addWorkoutDayBtn"
      );


    const saveProgramBtn =
      document.getElementById(
        "saveProgramBtn"
      );


    const saveStatus =
      document.getElementById(
        "saveStatus"
      );


    /* =========================
       DEFAULT PROGRAM
    ========================== */

    let programData = {

      days: [

        {
          name: "Legs",

          exercises: [

            {
              name: "Squat",
              sets: 3,
              reps: 8,
              note: "Coach note will go here."
            },

            {
              name: "Romanian Deadlift",
              sets: 3,
              reps: 10,
              note: "Coach note will go here."
            },

            {
              name: "Leg Extension",
              sets: 3,
              reps: 12,
              note: "Coach note will go here."
            }

          ]
        },


        {
          name: "Back + Biceps",

          exercises: [

            {
              name: "Lat Pulldown",
              sets: 3,
              reps: 10,
              note: "Coach note will go here."
            },

            {
              name: "Seated Cable Row",
              sets: 3,
              reps: 10,
              note: "Coach note will go here."
            },

            {
              name: "Dumbbell Curl",
              sets: 3,
              reps: 12,
              note: "Coach note will go here."
            }

          ]
        },


        {
          name: "Glutes",

          exercises: [

            {
              name: "Hip Thrust",
              sets: 3,
              reps: 10,
              note: "Coach note will go here."
            },

            {
              name: "Glute Kickback",
              sets: 3,
              reps: 12,
              note: "Coach note will go here."
            },

            {
              name: "Hip Abductor",
              sets: 3,
              reps: 12,
              note: "Coach note will go here."
            }

          ]
        },


        {
          name: "Chest + Shoulders",

          exercises: [

            {
              name: "Dumbbell Bench Press",
              sets: 3,
              reps: 10,
              note: "Coach note will go here."
            },

            {
              name: "Shoulder Press",
              sets: 3,
              reps: 10,
              note: "Coach note will go here."
            },

            {
              name: "Lateral Raise",
              sets: 3,
              reps: 12,
              note: "Coach note will go here."
            }

          ]
        }

      ]

    };


    /* =========================
       ESCAPE HTML
    ========================== */

    function escapeHtml(
      value
    ) {

      return String(
        value ?? ""
      )
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );

    }


    /* =========================
       RENDER PROGRAM EDITOR
    ========================== */

    function renderProgramEditor() {

      workoutDaysContainer.innerHTML =
        programData.days
          .map(
            (
              day,
              dayIndex
            ) => {

              const exercisesHtml =
                day.exercises
                  .map(
                    (
                      exercise,
                      exerciseIndex
                    ) => {

                      return `

                        <div
                          class="exercise"
                          data-exercise-index="${exerciseIndex}"
                        >

                          <div class="exercise-grid">


                            <!-- EXERCISE NAME -->

                            <div class="exercise-name-field">

                              <label>
                                Exercise
                              </label>

                              <input
                                type="text"
                                class="exercise-name-input"
                                value="${escapeHtml(
                                  exercise.name
                                )}"
                                data-day-index="${dayIndex}"
                                data-exercise-index="${exerciseIndex}"
                              >

                            </div>


                            <!-- SETS -->

                            <div>

                              <label>
                                Sets
                              </label>

                              <input
                                type="number"
                                min="0"
                                class="exercise-sets-input"
                                value="${escapeHtml(
                                  exercise.sets
                                )}"
                                data-day-index="${dayIndex}"
                                data-exercise-index="${exerciseIndex}"
                              >

                            </div>


                            <!-- REPS -->

                            <div>

                              <label>
                                Reps
                              </label>

                              <input
                                type="text"
                                class="exercise-reps-input"
                                value="${escapeHtml(
                                  exercise.reps
                                )}"
                                data-day-index="${dayIndex}"
                                data-exercise-index="${exerciseIndex}"
                              >

                            </div>

                          </div>


                          <!-- COACH NOTE -->

                          <div class="exercise-note-field">

                            <label>
                              Coach Note
                            </label>

                            <textarea
                              class="exercise-note-input"
                              data-day-index="${dayIndex}"
                              data-exercise-index="${exerciseIndex}"
                              placeholder="Optional note for this exercise..."
                            >${escapeHtml(
                              exercise.note
                            )}</textarea>

                          </div>


                          <!-- REMOVE EXERCISE -->

                          <div class="exercise-actions">

                            <button
                              type="button"
                              class="program-editor-button remove-button remove-exercise-btn"
                              data-day-index="${dayIndex}"
                              data-exercise-index="${exerciseIndex}"
                            >
                              Remove Exercise
                            </button>

                          </div>

                        </div>

                      `;

                    }
                  )
                  .join("");


              return `

                <section
                  class="workout-day"
                  data-workout-day="${dayIndex + 1}"
                >

                  <div class="workout-day-header">


                    <div class="workout-day-header-row">

                      <h2>
                        Day ${dayIndex + 1}
                      </h2>


                      <button
                        type="button"
                        class="program-editor-button remove-button remove-day-btn"
                        data-day-index="${dayIndex}"
                      >
                        Remove Day
                      </button>

                    </div>


                    <label>
                      Workout Name
                    </label>


                    <input
                      type="text"
                      class="day-name-input"
                      value="${escapeHtml(
                        day.name
                      )}"
                      data-day-index="${dayIndex}"
                      placeholder="Example: Legs"
                    >

                  </div>


                  <div class="exercise-list">

                    ${exercisesHtml}

                  </div>


                  <div class="add-exercise-row">

                    <button
                      type="button"
                      class="program-editor-button add-exercise-btn"
                      data-day-index="${dayIndex}"
                    >
                      + Add Exercise
                    </button>

                  </div>

                </section>

              `;

            }
          )
          .join("");

    }


    /* =========================
       KEEP PROGRAM DATA UPDATED
    ========================== */

    workoutDaysContainer.addEventListener(
      "input",
      event => {

        const target =
          event.target;


        const dayIndex =
          Number(
            target.dataset.dayIndex
          );


        const exerciseIndex =
          Number(
            target.dataset.exerciseIndex
          );


        /* -------------------------
           DAY NAME
        ------------------------- */

        if (
          target.classList.contains(
            "day-name-input"
          )
        ) {

          programData.days[
            dayIndex
          ].name =
            target.value;


          return;

        }


        /*
          If this element is not
          connected to an exercise,
          stop here.
        */

        if (
          !Number.isInteger(
            exerciseIndex
          )
        ) {

          return;

        }


        const exercise =
          programData.days[
            dayIndex
          ]?.exercises[
            exerciseIndex
          ];


        if (!exercise) {
          return;
        }


        /* -------------------------
           EXERCISE NAME
        ------------------------- */

        if (
          target.classList.contains(
            "exercise-name-input"
          )
        ) {

          exercise.name =
            target.value;

        }


        /* -------------------------
           SETS
        ------------------------- */

        if (
          target.classList.contains(
            "exercise-sets-input"
          )
        ) {

          exercise.sets =
            target.value;

        }


        /* -------------------------
           REPS
        ------------------------- */

        if (
          target.classList.contains(
            "exercise-reps-input"
          )
        ) {

          exercise.reps =
            target.value;

        }


        /* -------------------------
           EXERCISE NOTE
        ------------------------- */

        if (
          target.classList.contains(
            "exercise-note-input"
          )
        ) {

          exercise.note =
            target.value;

        }

      }
    );


    /* =========================
       ADD / REMOVE EXERCISES
       AND WORKOUT DAYS
    ========================== */

    workoutDaysContainer.addEventListener(
      "click",
      event => {

        const button =
          event.target.closest(
            "button"
          );


        if (!button) {
          return;
        }


        const dayIndex =
          Number(
            button.dataset.dayIndex
          );


        /* -------------------------
           ADD EXERCISE
        ------------------------- */

        if (
          button.classList.contains(
            "add-exercise-btn"
          )
        ) {

          programData.days[
            dayIndex
          ].exercises.push(
            {
              name: "",
              sets: 3,
              reps: 10,
              note: ""
            }
          );


          renderProgramEditor();


          return;

        }


        /* -------------------------
           REMOVE EXERCISE
        ------------------------- */

        if (
          button.classList.contains(
            "remove-exercise-btn"
          )
        ) {

          const exerciseIndex =
            Number(
              button.dataset.exerciseIndex
            );


          programData.days[
            dayIndex
          ].exercises.splice(
            exerciseIndex,
            1
          );


          renderProgramEditor();


          return;

        }


        /* -------------------------
           REMOVE DAY
        ------------------------- */

        if (
          button.classList.contains(
            "remove-day-btn"
          )
        ) {

          programData.days.splice(
            dayIndex,
            1
          );


          renderProgramEditor();

        }

      }
    );


    /* =========================
       ADD WORKOUT DAY
    ========================== */

    addWorkoutDayBtn.addEventListener(
      "click",
      () => {

        programData.days.push(
          {
            name: "",
            exercises: [
              {
                name: "",
                sets: 3,
                reps: 10,
                note: ""
              }
            ]
          }
        );


        renderProgramEditor();

      }
    );


    /* =========================
       LOAD CLIENT NAME
    ========================== */

    async function loadClientName() {

      const {
        data,
        error
      } =
        await window.auth.supabase
          .from("profiles")
          .select(
            "display_name"
          )
          .eq(
            "id",
            clientId
          )
          .single();


      if (error) {
        throw error;
      }


      const displayName =
        data?.display_name ||
        "Client";


      document.getElementById(
        "clientProgramHeading"
      ).textContent =
        `${displayName}'s Program`;

    }


    /* =========================
       LOAD CLIENT PROGRAM
       FROM SUPABASE
    ========================== */

    async function loadClientProgram() {

      const {
        data,
        error
      } =
        await window.auth.supabase
          .from("programs")
          .select(
            "coach_notes, program_data"
          )
          .eq(
            "user_id",
            clientId
          )
          .maybeSingle();


      if (error) {
        throw error;
      }


      /*
        If this client already has
        a saved program, load it.
      */

      if (data) {

        coachNotes.value =
          data.coach_notes ||
          "";


        if (
          data.program_data &&
          Array.isArray(
            data.program_data.days
          )
        ) {

          programData =
            data.program_data;

        }

      }


      /*
        If there is no saved program,
        the default program above
        remains loaded.
      */

      renderProgramEditor();

    }


    /* =========================
       SAVE PROGRAM
       TO SUPABASE
    ========================== */

    async function saveProgram() {

      try {

        if (!clientId) {

          throw new Error(
            "No client was selected."
          );

        }


        saveProgramBtn.disabled =
          true;


        saveProgramBtn.textContent =
          "Saving...";


        saveStatus.textContent =
          "";


        const {
          error
        } =
          await window.auth.supabase
            .from("programs")
            .upsert(
              {

                user_id:
                  clientId,

                coach_notes:
                  coachNotes.value.trim(),

                program_data:
                  programData,

                updated_at:
                  new Date().toISOString()

              },
              {

                onConflict:
                  "user_id"

              }
            );


        if (error) {
          throw error;
        }


        saveStatus.textContent =
          "Program saved!";

      } catch (error) {

        console.error(
          "Could not save client program:",
          error
        );


        saveStatus.textContent =
          "Program could not be saved.";


        alert(
          "The client's program could not be saved."
        );

      } finally {

        saveProgramBtn.disabled =
          false;


        saveProgramBtn.textContent =
          "Save Program";

      }

    }


    saveProgramBtn.addEventListener(
      "click",
      saveProgram
    );


    /* =========================
       INITIALIZE PAGE
    ========================== */

    async function initializePage() {

      try {

        /*
          Authenticate the logged-in
          coach.
        */

        const user =
          await window.auth.requireAuth();


        if (!user) {
          return;
        }


        /*
          Make sure a client ID exists.
        */

        if (!clientId) {

          document.getElementById(
            "clientProgramHeading"
          ).textContent =
            "Client Not Found";


          throw new Error(
            "No client ID was provided in the URL."
          );

        }


        /*
          Load selected client.
        */

        await loadClientName();


        /*
          Load the client's saved
          program from Supabase.
        */

        await loadClientProgram();


      } catch (error) {

        console.error(
          "Could not initialize client program page:",
          error
        );


        document.getElementById(
          "clientProgramHeading"
        ).textContent =
          "Client Program Could Not Load";

      }

    }


    initializePage();

  </script>


</body>

</html>
